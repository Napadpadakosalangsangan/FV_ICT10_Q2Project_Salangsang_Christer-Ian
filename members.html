<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drill 2</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>


	<style>
		.navbar {
			background-color: #123B5D;
			padding: 15px;
			text-align: center;
			margin-bottom: 25px;
		}

		.navbar a {
			color: white;
			text-decoration: none;
			padding: 10px 20px;
			margin: 0 5px;
			font-weight: bold;
		}

		.navbar a:hover {
			background-color: #245A83;
		}
		
    body {
        font-family: Arial, sans-serif;
        background-color: #EAF4FC;
        color: #23415C;
        margin: 20px;
    }

    .container {
        max-width: 400px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #A9CBE8;
        background-color: white;
    }

    h1 {
        text-align: center;
        margin-bottom: 5px;
        color: #1E527A;
    }

    .subtitle {
        text-align: center;
        margin-bottom: 25px;
        color: #527795;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        color: #234F72;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #A9CBE8;
        background-color: #F5FAFF;
    }

    button {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #28669C;
        background-color: #28669C;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: #1E527A;
    }

    #result {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #A9CBE8;
        background-color: #F0F7FD;
    }

    #result h3 {
        margin-top: 0;
        margin-bottom: 12px;
        color: #1E527A;
    }

    #member-list {
        text-align: left;
        white-space: pre-line;
        overflow-wrap: anywhere;
        line-height: 1.8;
        margin-bottom: 20px;
        color: #23415C;
    }

    #member-count {
        text-align: left;
        font-weight: bold;
        margin-bottom: 0;
        color: #28669C;
    }

    footer {
        margin-top: 25px;
        text-align: center;
        font-size: 12px;
        color: #7898B2;
    }
	</style>
</head>

<body>
	<nav class="navbar">
		<a href="index.html">Home</a>
		<a href="info.html">About Me</a>
		<a href="elements.html">Elements</a>
		<a href="members.html">Members</a>
	</nav>

  <div class="container">
    <h1>Marching Band Club</h1>
    <p class="subtitle">Add New Club Member</p>

    <label>First Name</label>
    <input type="text" id="Fname" placeholder="Enter your first name">

    <label>Last Name</label>
    <input type="text" id="Lname" placeholder="Enter your last name">

    <button id="recruit" py-click="recruit">RECRUIT</button>

    <div id="result">
        <h3>All Members:</h3>
        <p id="list">No members added yet.</p>

        <h3>TOTAL MEMBERS:</h3>
        <p id="count">0</p>
    </div>

    <footer>
      Marching Band | Recruiting New Members
    </footer>

  </div>
  <script type="py" src="members.py"></script>

</body>
</html>
