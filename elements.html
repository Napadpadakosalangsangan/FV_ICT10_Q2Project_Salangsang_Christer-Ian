<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills Test Q2</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>


  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #EAF4FC;
      color: #23415C;
      margin: 20px;
    }

    .container {
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #A9CBE8;
      background-color: white;
    }

    h1 {
      text-align: center;
      margin-top: 5px;
      margin-bottom: 8px;
      font-size: 26px;
      color: #1E527A;
    }

    .subtitle {
      text-align: center;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: normal;
      color: #527795;
    }

    .instructions {
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 25px;
      color: #527795;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #234F72;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #A9CBE8;
      background-color: #F5FAFF;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #28669C;
      background-color: #28669C;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #1E527A;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #A9CBE8;
      background-color: #F0F7FD;
    }

    #result h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #1E527A;
    }

    #result p {
      text-align: left;
      line-height: 1.8;
      margin-bottom: 5px;
      color: #23415C;
    }

    footer {
      margin-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #7898B2;
    }
  </style>

</head>
<body>
  
  <div class="container">
    <h1>Periodic Table Finder</h1>
    <h3 class="subtitle">Non-Metal Element Information</h3>
    <p class="instructions">Enter an element symbol to find its name, atomic number, and atomic mass.</p>

    <label>Element Symbol</label>
      <input type="text" id="element" placeholder="e.g., H, Cl, Kr">

    <button id="check" py-click="check">Check</button>

    <div id="result">
      <h3>Element Information</h3>

      <p>Symbol: <span id="symbol">-</span></p>
      <p>Name: <span id="name">-</span></p>
      <p>Atomic Number: <span id="number">-</span></p>
      <p>Atomic Mass: <span id="mass">-</span></p>

    </div>

    <footer>
      Periodic Table Information Finder
    </footer>
  </div>

  <script type="py" src="elements.py"></script>
</body>
</html>
